apiVersion: apps/v1
kind: Deployment
metadata:
  name: medifollow-admin
  namespace: medifollow-production
  labels:
    app: medifollow-admin
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: medifollow-admin
  template:
    metadata:
      labels:
        app: medifollow-admin
        version: v1
    spec:
      containers:
      - name: medifollow-admin
        image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/medifollow-admin:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: medifollow-admin-secrets
              key: database-url
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: medifollow-admin-secrets
              key: nextauth-secret
        - name: NEXTAUTH_URL
          value: "https://admin.medifollow.com"
        - name: PUSHER_APP_ID
          valueFrom:
            secretKeyRef:
              name: medifollow-admin-secrets
              key: pusher-app-id
        - name: PUSHER_KEY
          valueFrom:
            secretKeyRef:
              name: medifollow-admin-secrets
              key: pusher-key
        - name: PUSHER_SECRET
          valueFrom:
            secretKeyRef:
              name: medifollow-admin-secrets
              key: pusher-secret
        - name: PUSHER_CLUSTER
          valueFrom:
            secretKeyRef:
              name: medifollow-admin-secrets
              key: pusher-cluster
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: medifollow-admin-secrets
              key: sentry-dsn
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always