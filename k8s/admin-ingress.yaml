apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medifollow-admin-ingress
  namespace: medifollow-production
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - admin.medifollow.com
    secretName: medifollow-admin-tls
  rules:
  - host: admin.medifollow.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: medifollow-admin-service
            port:
              number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medifollow-admin-staging-ingress
  namespace: medifollow-staging
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - admin-staging.medifollow.com
    secretName: medifollow-admin-staging-tls
  rules:
  - host: admin-staging.medifollow.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: medifollow-admin-service-staging
            port:
              number: 80