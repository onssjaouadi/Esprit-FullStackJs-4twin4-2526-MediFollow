apiVersion: v1
kind: Secret
metadata:
  name: medifollow-admin-secrets
  namespace: medifollow-production
type: Opaque
data:
  # These should be base64 encoded
  # database-url: <base64-encoded-database-url>
  # nextauth-secret: <base64-encoded-nextauth-secret>
  # pusher-app-id: <base64-encoded-pusher-app-id>
  # pusher-key: <base64-encoded-pusher-key>
  # pusher-secret: <base64-encoded-pusher-secret>
  # sentry-dsn: <base64-encoded-sentry-dsn>

