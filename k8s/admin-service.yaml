apiVersion: v1
kind: Service
metadata:
  name: medifollow-admin-service
  namespace: medifollow-production
  labels:
    app: medifollow-admin
spec:
  selector:
    app: medifollow-admin
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: medifollow-admin-service-staging
  namespace: medifollow-staging
  labels:
    app: medifollow-admin
spec:
  selector:
    app: medifollow-admin
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP